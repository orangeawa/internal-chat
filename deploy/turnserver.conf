# coturn 配置
# 只在「异地打洞失败」时兜底，局域网 / 同一 NAT 出口不会走这里。
#
# 关键：公网 IP 是 1:1 NAT（阿里云 EIP），必须显式声明 external-ip，
# 否则 coturn 会把内网地址写进 candidate，浏览器拿到后连不通。

# 公网IP/内网IP
external-ip=47.120.48.2/172.18.44.58

# 只监听业务网卡，避免绑到 docker 网桥上
listening-ip=172.18.44.58
listening-port=3478

# 中继端口段。安全组需放行 UDP 49160-49200。
# 每个中继会话占 2 个端口，40 个端口约支撑 20 个并发中继。
min-port=49160
max-port=49200

# 认证：长期凭证模式，用户名/密码需与 room_pwd.json 的 turns 一致
lt-cred-mech
realm=internal-chat
user=chat:CHANGE_ME_TURN_PASSWORD

# WebRTC 必需的指纹校验
fingerprint

# 只走 turn:（UDP），不需要 turns:（TLS）
no-tls
no-dtls

# 关闭命令行管理口
no-cli

# 日志输出到容器 stdout
log-file=stdout
simple-log

# 安全：禁止中继到内网网段，避免被当作内网探测跳板
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=::1

# 配额：防止单个账号刷爆带宽
user-quota=12
total-quota=100
